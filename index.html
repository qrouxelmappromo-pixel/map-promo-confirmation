<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MAP’promo - Confirmation</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif;
      background: linear-gradient(135deg, #00868B, #E11D48);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      max-width: 320px;
    }

    .logo {
      width: 160px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #111;
    }

    .highlight {
      color: #00868B;
    }

    p {
      font-size: 14px;
      color: #555;
      margin: 0;
      line-height: 1.5;
    }

    .welcome {
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- LOGO -->
    <img src="logo.png" class="logo" />

    <h1>
      Adresse e-mail <span class="highlight">confirmée</span>
    </h1>

    <p>
      Votre compte MAP’promo est maintenant activé.<br><br>
      Vous pouvez fermer cette page et retourner dans l’application.
    </p>

    <p class="welcome">
      Merci et bienvenue sur MAP’promo 🎉
    </p>

  </div>

</body>
</html>
