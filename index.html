<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAP’promo - Confirmation</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 400px;
    }

    h1 {
      color: #00868B;
      font-size: 22px;
      margin-bottom: 16px;
    }

    p {
      color: #555;
      font-size: 16px;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      background: #E11D48;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Adresse e-mail confirmée ✅</h1>
    <p>Votre compte MAP’promo est maintenant activé.</p>
    <a class="btn" href="mappromo://auth/callback">Ouvrir l’application</a>
  </div>
</body>
</html>
